<!doctype html>
<html lang="en" data-ui-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FlowRead rebuilds PDFs, slides, Word files and web pages as structured, accessible documents you can read in your own spacing, font and colours, and download as an accessible PDF." />
    <meta name="theme-color" content="#FAFAF8" />
    <title>FlowRead</title>
    <script>
      // Apply the saved reading theme before first paint (no flash of the wrong colours).
      try {
        var p = JSON.parse(localStorage.getItem('flowread-access:reader-prefs') || 'null');
        var t = p && p.settings && p.settings.theme;
        if (t === 'light' || t === 'cream' || t === 'dark' || t === 'high-contrast') document.documentElement.setAttribute('data-ui-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
